<!DOCTYPE html>
<html>
<head>
    <title>Staff Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-header">
            <div class="login-icon">⛽</div>
            <h1>IOSIF FUELS POS</h1>
            <p>Staff Access Panel</p>
        </div>

        {% if error %}
            <p class="login-error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/login">
            <input type="password" name="password" placeholder="Enter Staff Password" required>
            <button type="submit" class="login-button">Enter POS</button>
        </form>

        <p class="login-footer">
            © 2026 IOSIF P IOSIF TRADING LTD - All Rights Reserved
        </p>

    </div>
</div>

</body>
</html>
