<!DOCTYPE html>
<html>
<head>
    <title>Transactions</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Transactions</h1>

    <div class="nav">
        <a href="/">Back to POS</a>
    </div>

    <div class="card">
        <table>
            <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>Type</th>
                <th>Item</th>
                <th>Amount</th>
                <th>Car Reg</th>
                <th>Void</th>
            </tr>

            {% for t in transactions %}
            <tr>
                <td>{{ t.date }}</td>
                <td>{{ t.customer_name or "Cash Sale" }}</td>
                <td>{{ t.type }}</td>
                <td>{{ t.item }}</td>
                <td>€{{ "%.2f"|format(t.amount) }}</td>
                <td>{{ t.car_reg }}</td>
                <td>
                    <form method="POST" action="/void_transaction/{{ t.transaction_id }}">
                        <button type="submit" onclick="return confirm('Void this transaction?');">
                            Void
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>

</body>
</html>
