<!DOCTYPE html>
<html>
<head>
    <title>IOSIF FUELS POS</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>IOSIF P IOSIF TRADING LTD | Batch #{{ batch }}</h1>
    
    <div class="top-actions">
    <a href="/" class="nav-button">POS</a>
    <a href="/customers" class="nav-button">Customers</a>
    <a href="/transactions" class="nav-button">Transactions</a>
    <a href="/reports" class="nav-button">Reports</a>
    <a href="/manager" class="nav-button manager-button">Manager</a>

    <form method="POST" action="/end_day" style="display:inline;">
        <button type="submit" class="endday-button">
            End Day / Shift Day
        </button>
    </form>
</div>
    <div id="clock" style="font-size:20px; font-weight:bold; margin-bottom:15px;"></div>

    <div class="grid">


        <div class="card">
    <h2>Charge / Payment</h2>

    <form method="POST" action="/charge">

        <select name="customer_id" required>
            {% for c in customers %}
            <option value="{{ c.id }}">
                {{ c.name }}{% if c.phone %} - {{ c.phone }}{% endif %}
            </option>
            {% endfor %}
        </select>

        <select name="type" id="type" onchange="updateChargeButton()">
            <option>Fuel</option>
            <option>Payment</option>
        </select>

        <input name="item" placeholder="Fuel Type / Description">
        <input name="amount" type="number" step="0.01" placeholder="Amount">
        <input name="car_reg" placeholder="Car Reg">

        <button type="submit" id="chargeButton">Charge</button>
    </form>
</div>

        <div class="card">
            <h2>Sell Accessory</h2>
            <form method="POST" action="/sell_accessory" target="_blank">

                <select name="accessory_id">
                    {% for a in accessories %}
                    <option value="{{ a.id }}">
                        {{ a.name }} - €{{ "%.2f"|format(a.sell_price or a.price) }} - Stock: {{ a.qty }}
                    </option>
                    {% endfor %}
                </select>

                <input name="qty" type="number" value="1">

                <button type="submit">Sell</button>
            </form>
        </div>

    </div>


    <div class="nav">
        <a href="/reports">Daily Report</a>
<a href="/monthly_report">Monthly Report</a>
        <a href="/fuel_stock">Fuel Tanks</a>
        <a href="/accessories_statement">Accessories Statement</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<script>
function updateClock() {
    const now = new Date();
    const date = now.toLocaleDateString();
    const time = now.toLocaleTimeString();

    document.getElementById("clock").innerHTML =
        date + " | " + time;
}

function updateChargeButton() {
    let type = document.getElementById("type").value;
    let button = document.getElementById("chargeButton");

    if (type === "Payment") {
        button.innerText = "Payment";
        button.style.backgroundColor = "red";
    } else {
        button.innerText = "Charge";
        button.style.backgroundColor = "green";
    }
}

setInterval(updateClock, 1000);
updateClock();
updateChargeButton();


    
</body>
</html>
