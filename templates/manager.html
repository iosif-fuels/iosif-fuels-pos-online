<!DOCTYPE html>
<html>
<head>
    <title>Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Manager Panel</h1>

    <div class="nav">
        <a href="/">Back to POS</a>
    </div>

    <div class="card">
        <h2>Add Customer</h2>
        <form method="POST" action="/add_customer">
            <input name="name" placeholder="Customer Name" required>
            <input name="phone" placeholder="Phone">
            <input name="opening_balance" type="number" step="0.01" placeholder="Opening Balance / Already Owes €">
            <input name="credit_limit" type="number" step="0.01" placeholder="Credit Limit">
            <button type="submit">Add Customer</button>
        </form>
    </div>

    <div class="card">
        <h2>Add Accessory</h2>
        <form method="POST" action="/add_accessory">
            <input name="name" placeholder="Accessory Name" required>
            <input name="qty" type="number" placeholder="Quantity" required>
            <input name="buy_price" type="number" step="0.01" placeholder="Buy Price">
            <input name="sell_price" type="number" step="0.01" placeholder="Sell Price">
            <button type="submit">Add Accessory</button>
        </form>
    </div>

</div>

</body>
</html>
